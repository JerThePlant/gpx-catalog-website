function gpxCatalogUpdateSidePanel(item) {
  var panel = document.getElementById('map-side-panel');
  if (!panel) {
    return;

    return '<div class="panel-meta-row"><span class="panel-meta-label">' +

    '<div class="panel-image-wrap">' +

    '</div>' +
    '<div class="panel-meta">' + metaHtml + '</div>' +
    linkHtml;
}

function gpxCatalogRegisterSidePanelHandlers() {
  if (!window.gpxCatalogSidePanelItems) {
    return;
  }
  window.gpxCatalogSidePanelItems.forEach(function(item) {
    var layer = window[item.layer_name];
    if (!layer || !layer.on) {
      return;
    }
    layer.on('click', function() {
      gpxCatalogUpdateSidePanel(item);
    });
  });
}

  gpxCatalogRegisterSidePanelHandlers();
});

document.addEventListener('DOMContentLoaded', function() {
  var panel = document.getElementById('map-side-panel');
  if (!panel || !galleryData.length) {
    return;
  }

  function buildGallery() {
    var galleryContainer = document.getElementById('gallery-container');
    if (galleryContainer) {
      return galleryContainer;
    }

    var placeholder = panel.querySelector('.panel-empty');
    if (placeholder) {
      placeholder.remove();
    }

    galleryContainer = document.createElement('div');
    galleryContainer.id = 'gallery-container';
    galleryContainer.innerHTML = `
       <div class="panel-image-wrap">
         <img id="gallery-preview-img" class="panel-image clickable" src="" alt="" tabindex="0" data-current-index="0" data-full="">
       </div>
       <p id="gallery-preview-title" class="gallery-preview-title"></p>
       <div id="gallery-preview-meta" class="panel-meta"></div>
     `;

    panel.insertBefore(galleryContainer, panel.firstChild);
    return galleryContainer;
  }

  function renderThumbnails(thumbnailContainer) {
    thumbnailContainer.innerHTML = '';
    galleryData.forEach(function(item, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gallery-thumb';
      btn.dataset.full = item.full;
      btn.dataset.preview = item.preview;
      btn.dataset.title = item.title;
      btn.dataset.index = idx;

      var img = document.createElement('img');
      img.src = item.preview;
      img.alt = item.title;
      img.loading = 'lazy';

      btn.appendChild(img);
      btn.addEventListener('click', function() {
        showPreviewByIndex(idx);
      });
      thumbnailContainer.appendChild(btn);
    });
  }

  function showPreviewByIndex(i) {
    if (i < 0 || i >= galleryData.length) {
      return;
    }
    buildGallery();
    var previewImg = document.getElementById('gallery-preview-img');
    var previewTitle = document.getElementById('gallery-preview-title');
    var previewMeta = document.getElementById('gallery-preview-meta');
    var thumbButtons = document.querySelectorAll('.gallery-thumb');
    if (!previewImg || !previewTitle) {
      return;
    }
    previewImg.src = galleryData[i].preview;
    previewImg.alt = galleryData[i].title || '';
    previewTitle.textContent = galleryData[i].title || '';
    previewImg.dataset.currentIndex = i;
    previewImg.dataset.full = galleryData[i].full;
    renderMetadata(previewMeta, galleryData[i].meta);

    thumbButtons.forEach(function(btn, idx) {
      btn.classList.toggle('active-thumb', idx === i);
    });
  }

  function renderMetadata(container, metadata) {
    if (!container) {
      return;
    }
    container.innerHTML = '';
    (metadata || []).forEach(function(row) {
      var metaRow = document.createElement('div');
      metaRow.className = 'panel-meta-row';
      var label = document.createElement('span');
      label.className = 'panel-meta-label';
      label.textContent = row.label;
      var value = document.createElement('span');
      value.textContent = row.value;
      metaRow.appendChild(label);
      metaRow.appendChild(value);
      container.appendChild(metaRow);
    });
  }

  function openLightbox(index) {
    var modal = document.getElementById('gallery-modal');
    var modalImg = document.getElementById('modal-img');
    var modalTitle = document.getElementById('modal-title');
    modal.style.display = 'block';
    modal.dataset.currentIndex = index;
    modalImg.src = galleryData[index].full;
    modalTitle.textContent = galleryData[index].title || '';
  }

  function closeLightbox() {
    var modal = document.getElementById('gallery-modal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

  function bindGalleryEvents() {
    // Delegated so the click still fires once the preview image is lazily created.
    panel.addEventListener('click', function(e) {
      if (e.target.id !== 'gallery-preview-img') {
        return;
      }
      var idx = parseInt(e.target.dataset.currentIndex || 0, 10);
      openLightbox(idx);
    });

    document.addEventListener('keydown', function(e) {
      var modal = document.getElementById('gallery-modal');
      if (!modal || modal.style.display !== 'block') return;
      var cur = parseInt(modal.dataset.currentIndex || 0, 10);
      if (e.key === 'ArrowRight') {
        cur = Math.min(galleryData.length - 1, cur + 1);
        modal.dataset.currentIndex = cur;
        document.getElementById('modal-img').src = galleryData[cur].full;
        document.getElementById('modal-title').textContent = galleryData[cur].title || '';
      } else if (e.key === 'ArrowLeft') {
        cur = Math.max(0, cur - 1);
        modal.dataset.currentIndex = cur;
        document.getElementById('modal-img').src = galleryData[cur].full;
        document.getElementById('modal-title').textContent = galleryData[cur].title || '';
      } else if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    document.addEventListener('click', function(e) {
      var modal = document.getElementById('gallery-modal');
      if (!modal || modal.style.display !== 'block') return;
      if (e.target.id === 'modal-close' || e.target.id === 'gallery-modal') {
        closeLightbox();
      } else if (e.target.id === 'modal-next') {
        var cur = parseInt(modal.dataset.currentIndex || 0, 10);
        cur = Math.min(galleryData.length - 1, cur + 1);
        modal.dataset.currentIndex = cur;
        document.getElementById('modal-img').src = galleryData[cur].full;
        document.getElementById('modal-title').textContent = galleryData[cur].title || '';
      } else if (e.target.id === 'modal-prev') {
        var cur2 = parseInt(modal.dataset.currentIndex || 0, 10);
        cur2 = Math.max(0, cur2 - 1);
        modal.dataset.currentIndex = cur2;
        document.getElementById('modal-img').src = galleryData[cur2].full;
        document.getElementById('modal-title').textContent = galleryData[cur2].title || '';
      }
    });
  }

  function updateGalleryFromSidePanel(item) {
    if (!item || !item.image) {
      return;
    }
    var index = galleryData.findIndex(function(img) {
      return img.full === item.image;
    });
    if (index === -1) {
      index = 0;
    }
    showPreviewByIndex(index);
  }

  var thumbRow = document.getElementById('thumb-row');
  // Elevation plots and photo markers surfaced by the map side panel augment the gallery too.
  function augmentGalleryWithSidePanelImages() {
    if (!window.gpxCatalogSidePanelItems || !window.gpxCatalogSidePanelItems.length) return;
    window.gpxCatalogSidePanelItems.forEach(function(item) {
      if (!item || !item.image) return;
      var exists = galleryData.some(function(g){ return g.full === item.image || g.preview === item.image; });
      if (!exists) {
        galleryData.push({
          full: item.image,
          preview: item.image,
          title: item.title || '',
          meta: item.meta || []
        });
      } else {
        var galleryItem = galleryData.find(function(g) {
          return g.full === item.image || g.preview === item.image;
        });
        galleryItem.meta = item.meta || [];
        galleryItem.title = item.title || galleryItem.title;
      }
    });
  }

  augmentGalleryWithSidePanelImages();
  if (thumbRow) {
    renderThumbnails(thumbRow);
  }
  bindGalleryEvents();

  // Gallery is built lazily by showPreviewByIndex() on first thumbnail/marker click.
  window.gpxCatalogUpdateSidePanel = updateGalleryFromSidePanel;
});
</script>
