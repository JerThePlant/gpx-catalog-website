<div class="mobile-view-toggle" role="tablist" aria-label="Map or details view">
  <button type="button" class="mobile-view-btn active" data-view="map" role="tab" aria-selected="true">
    <span class="mobile-view-arrow" aria-hidden="true">&#8249;</span><span class="mobile-view-label">Map</span>
  </button>
  <button type="button" class="mobile-view-btn" data-view="details" role="tab" aria-selected="false">Details</button>
</div>
<script>
(function() {
  var toggle = document.currentScript.previousElementSibling;
  // .map-panel-inner is parsed after this script runs, so the lookup must wait for DOMContentLoaded.
  document.addEventListener('DOMContentLoaded', function() {
    var panelInner = toggle.parentElement.querySelector('.map-panel-inner');
    if (!panelInner) {
      return;
    }
    var mapBtn = toggle.querySelector('[data-view="map"]');
    var mapLabel = mapBtn.querySelector('.mobile-view-label');

    function setView(view) {
      toggle.querySelectorAll('.mobile-view-btn').forEach(function(b) {
        var active = b.dataset.view === view;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      panelInner.classList.toggle('mobile-view-map', view === 'map');
      panelInner.classList.toggle('mobile-view-details', view === 'details');
      mapLabel.textContent = view === 'details' ? 'Back to Map' : 'Map';
      mapBtn.classList.toggle('mobile-view-btn--back', view === 'details');
      // Leaflet caches its container size at init time (before this class change); a
      // synthetic resize nudges it to recompute against the new CSS-driven height.
      requestAnimationFrame(function() {
        window.dispatchEvent(new Event('resize'));
      });
    }

    setView('map');
    toggle.addEventListener('click', function(e) {
      var btn = e.target.closest('.mobile-view-btn');
      if (!btn) {
        return;
      }
      setView(btn.dataset.view);
    });

    window.gpxCatalogSetMobileView = setView;
  });
})();
</script>

function gpxCatalogUpdateSidePanel(item) {
  // On mobile, reveal the panel (it's hidden while the "Map" tab is active).
  if (window.gpxCatalogSetMobileView) {
    window.gpxCatalogSetMobileView('details');
  }

  // Pages with a photo gallery (e.g. hike.html) own the panel rendering; this is only the
  // fallback renderer for pages without one (e.g. the world map, which needs the "Open hike" link).
  if (window.gpxCatalogOnSidePanelItem) {
    window.gpxCatalogOnSidePanelItem(item);
    return;
  }

  var panel = document.getElementById('map-side-panel');
  if (!panel) {
    return;
  }

  var metaHtml = item.meta.map(function(row) {
    return '<div class="panel-meta-row"><span class="panel-meta-label">' +
      row.label + '</span><span>' + row.value + '</span></div>';
  }).join('');

  var linkHtml = item.url ?
    '<a class="button" href="' + item.url + '">Open hike</a>' : '';

  var imageHtml = item.url ?
    '<a href="' + item.url + '"><img class="panel-image" src="' + item.image + '" alt="' + item.image_alt + '"></a>' :
    '<img class="panel-image" src="' + item.image + '" alt="' + item.image_alt + '">';

  panel.innerHTML =
    '<div class="panel-header">' +
      '<h2>' + item.title + '</h2>' +
      '<p>' + item.subtitle + '</p>' +
    '</div>' +
    '<div class="panel-image-wrap">' +
      imageHtml +
    '</div>' +
    '<div class="panel-meta">' + metaHtml + '</div>' +
    linkHtml;
}

function gpxCatalogRegisterSidePanelHandlers() {
  if (!window.gpxCatalogSidePanelItems) {
    return;
  }
  window.gpxCatalogSidePanelItems.forEach(function(item) {
    var layer = window[item.layer_name];
    if (!layer || !layer.on) {
      return;
    }
    layer.on('click', function() {
      gpxCatalogUpdateSidePanel(item);
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  gpxCatalogRegisterSidePanelHandlers();
});
</script>
