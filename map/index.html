function gpxCatalogUpdateSidePanel(item) {
  var panel = document.getElementById('map-side-panel');
  if (!panel) {
    return;
  }

  var metaHtml = item.meta.map(function(row) {
    return '<div class="panel-meta-row"><span class="panel-meta-label">' +
      row.label + '</span><span>' + row.value + '</span></div>';
  }).join('');

  var linkHtml = item.url ?
    '<a class="button" href="' + item.url + '">Open hike</a>' : '';

  panel.innerHTML =
    '<div class="panel-header">' +
      '<h2>' + item.title + '</h2>' +
      '<p>' + item.subtitle + '</p>' +
    '</div>' +
    '<div class="panel-image-wrap">' +
      '<img class="panel-image" src="' + item.image + '" alt="' + item.image_alt + '">' +
    '</div>' +
    '<div class="panel-meta">' + metaHtml + '</div>' +
    linkHtml;
}

function gpxCatalogRegisterSidePanelHandlers() {
  if (!window.gpxCatalogSidePanelItems) {
    return;
  }
  window.gpxCatalogSidePanelItems.forEach(function(item) {
    var layer = window[item.layer_name];
    if (!layer || !layer.on) {
      return;
    }
    layer.on('click', function() {
      gpxCatalogUpdateSidePanel(item);
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  gpxCatalogRegisterSidePanelHandlers();
});
</script>
